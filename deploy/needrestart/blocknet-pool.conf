# Installed by scripts/deploy_bntpool.sh to /etc/needrestart/conf.d/.
#
# unattended-upgrades runs needrestart, which restarts any service whose
# executable or libraries changed on disk. A Stratum deploy replaces the
# gateway binary without restarting it (that would disconnect every miner),
# so the next package upgrade restarted the gateway on its own (2026-10-28
# 06:31 UTC). Engines are replaced by gateway handovers and daemons by the
# rolling daemon deploy, never both instances at once. needrestart leaves
# these alone; they still appear in its "outdated" list.
$nrconf{override_rc}{qr(^blocknet-pool-gateway\.service$)} = 0;
$nrconf{override_rc}{qr(^blocknet-pool-stratum(@.+)?\.service$)} = 0;
$nrconf{override_rc}{qr(^blocknetd@.+\.service$)} = 0;
