[Service]
# Pool services keep local state derived from live Postgres connections. Bounce
# them after the cluster comes back so monitors and workers reconnect cleanly
# after package upgrades or manual database restarts.
#
# Use --no-block because this hook runs while postgresql@ is still in
# start-post. Pool units order After=postgresql.service, so a blocking restart
# here can deadlock systemd during package-managed PostgreSQL restarts.
ExecStartPost=/usr/bin/systemctl --no-block try-restart blocknet-pool-api.service blocknet-pool-stratum.service blocknet-pool-monitor.service
