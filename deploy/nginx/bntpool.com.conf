server {
    server_name bntpool.com;

    client_max_body_size 2m;

    server_tokens off;

    location / {
        limit_req zone=bntpool_general burst=300 nodelay;
        include /etc/nginx/snippets/bntpool-proxy.conf;
    }

    # Public static content is highly compressible. Keep authenticated API
    # responses outside this location and preserve their existing behavior.
    location ~ ^/(ui-assets/|blog/) {
        limit_req zone=bntpool_general burst=300 nodelay;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css text/javascript application/javascript application/json application/xml image/svg+xml;
        include /etc/nginx/snippets/bntpool-proxy.conf;
    }

    # Report routes that hit Postgres or the daemon on every request.
    location ~ ^/api/(status|blocks|luck|stats/history|payouts/recent|miner/[^/]+/hashrate)(/|$) {
        limit_req zone=bntpool_general burst=300 nodelay;
        limit_req zone=bntpool_expensive burst=60 nodelay;
        include /etc/nginx/snippets/bntpool-proxy.conf;
    }

    location /api/admin/ {
        limit_req zone=bntpool_general burst=300 nodelay;
        limit_req zone=bntpool_admin burst=100 nodelay;
        include /etc/nginx/snippets/bntpool-proxy.conf;
    }

    # The API sets CSP, X-Frame-Options, nosniff and Referrer-Policy itself.
    add_header Strict-Transport-Security "max-age=31536000" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bntpool.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bntpool.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Consolidate links and search indexing on the canonical host. 308 also
# preserves the method/body for clients that use the www API address.
server {
    server_name www.bntpool.com;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 308 https://bntpool.com$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/bntpool.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bntpool.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name bntpool.com www.bntpool.com;
    server_tokens off;
    return 308 https://bntpool.com$request_uri;
}
