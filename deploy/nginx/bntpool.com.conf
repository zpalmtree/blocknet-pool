server {
    server_name bntpool.com www.bntpool.com;

    client_max_body_size 2m;

    server_tokens off;

    location / {
        limit_req zone=bntpool_general burst=300 nodelay;
        include /etc/nginx/snippets/bntpool-proxy.conf;
    }

    # Report routes that hit Postgres or the daemon on every request.
    location ~ ^/api/(status|blocks|luck|stats/history|payouts/recent|miner/[^/]+/hashrate)(/|$) {
        limit_req zone=bntpool_general burst=300 nodelay;
        limit_req zone=bntpool_expensive burst=60 nodelay;
        include /etc/nginx/snippets/bntpool-proxy.conf;
    }

    location /api/admin/ {
        limit_req zone=bntpool_general burst=300 nodelay;
        limit_req zone=bntpool_admin burst=100 nodelay;
        include /etc/nginx/snippets/bntpool-proxy.conf;
    }

    # The API sets CSP, X-Frame-Options, nosniff and Referrer-Policy itself.
    add_header Strict-Transport-Security "max-age=31536000" always;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bntpool.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bntpool.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.bntpool.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = bntpool.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name bntpool.com www.bntpool.com;
    return 404; # managed by Certbot




}