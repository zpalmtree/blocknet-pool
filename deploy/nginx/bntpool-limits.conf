# Per-client request ceilings for bntpool.com. Measured 2026-10-25: the busiest
# client (many miners behind one address) averaged ~23 req/s over its peak
# minute, and the expensive report routes peaked at 34 req/min per client.
# These limits sit well above legitimate use and only stop floods.
limit_req_zone $binary_remote_addr zone=bntpool_general:20m rate=50r/s;
limit_req_zone $binary_remote_addr zone=bntpool_expensive:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=bntpool_admin:5m rate=10r/s;
limit_req_status 429;
limit_req_log_level warn;
server_tokens off;
