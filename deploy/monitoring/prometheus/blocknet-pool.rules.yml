groups:
  - name: blocknet-pool
    rules:
      - alert: BlocknetPoolMonitorStale
        expr: time() - blocknet_pool_monitor_last_sample_timestamp_seconds > 30
        for: 1m
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Pool monitor stopped updating
          description: The on-host monitor has not produced a fresh sample for more than 30 seconds.

      - alert: BlocknetPoolApiDown
        expr: blocknet_pool_monitor_api_up == 0
        for: 30s
        labels:
          severity: critical
          visibility: public
        annotations:
          summary: Pool API is down
          description: The on-host monitor cannot reach the API process.

      - alert: BlocknetPoolStratumDown
        expr: blocknet_pool_monitor_stratum_up == 0
        for: 30s
        labels:
          severity: critical
          visibility: public
        annotations:
          summary: Pool stratum is down
          description: The on-host monitor cannot reach the Stratum listener.

      - alert: BlocknetPoolDatabaseDown
        expr: blocknet_pool_monitor_db_up == 0
        for: 20s
        labels:
          severity: critical
          visibility: public
        annotations:
          summary: Pool database is down
          description: The pool cannot complete its Postgres probe.

      - alert: BlocknetPoolDaemonDown
        expr: blocknet_pool_monitor_daemon_up == 0
        for: 30s
        labels:
          severity: critical
          visibility: public
        annotations:
          summary: Blocknet daemon is down
          description: The pool cannot reach the upstream Blocknet daemon.

      - alert: BlocknetPoolDaemonSyncing
        expr: blocknet_pool_monitor_daemon_syncing == 1
        for: 2m
        labels:
          severity: warning
          visibility: public
        annotations:
          summary: Blocknet daemon is syncing
          description: The daemon is reachable but still reports syncing.

      - alert: BlocknetPoolTemplateStale
        # Template age legitimately grows for the length of a round (an hour or
        # more observed) because the pool ignores timestamp-only template
        # changes. Refresh is only actually broken when the chain tip advanced
        # but the template did not follow it.
        expr: >-
          blocknet_pool_monitor_template_age_seconds > 240
          and changes(blocknet_pool_monitor_chain_height[10m]) > 0
          and resets(blocknet_pool_monitor_template_age_seconds[10m]) == 0
        for: 2m
        labels:
          severity: warning
          visibility: public
        annotations:
          summary: Pool job template is not following the chain tip
          description: The chain tip advanced within the last 10 minutes but the job template has not refreshed and is older than 4 minutes.

      - alert: BlocknetPoolTemplateCriticallyStale
        # Absolute backstop that also covers a fully halted chain, where the
        # tip-following alert above can never fire.
        expr: blocknet_pool_monitor_template_age_seconds > 3600
        for: 5m
        labels:
          severity: critical
          visibility: public
        annotations:
          summary: Pool job template is critically stale
          description: The job template has not refreshed for over an hour; template refresh or the chain itself is stuck.

      - alert: BlocknetPoolTemplateLeaseRefreshDelayed
        expr: blocknet_pool_monitor_last_refresh_success_millis > 45000
        for: 1m
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Pool template lease refresh is delayed
          description: The pool has not fetched or renewed its current daemon template successfully for more than 45 seconds.

      - alert: BlocknetPoolTemplateLeaseRefreshCritical
        expr: blocknet_pool_monitor_last_refresh_success_millis > 120000
        for: 1m
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Pool template lease refresh is critically delayed
          description: The pool has not fetched or renewed its current daemon template successfully for more than two minutes.

      - alert: BlocknetPoolTemplateLeaseRenewalFailed
        expr: increase(blocknet_pool_monitor_template_renewal_failures_total[5m]) > 0
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Pool template lease renewal failed
          description: At least one daemon template renewal failed in the last five minutes; the pool should have fetched a replacement automatically.

      - alert: BlocknetPoolTemplateLeaseExpiredBeforeRenewal
        expr: increase(blocknet_pool_monitor_template_renewal_expired_responses_total[15m]) > 0
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Pool template expired before renewal
          description: The daemon reported an unknown or expired template during renewal in the last 15 minutes.

      - alert: BlocknetPoolTemplateExpiredAtBlockSubmit
        expr: >-
          increase(blocknet_pool_monitor_template_submit_expired_responses_total[15m])
          > increase(blocknet_pool_monitor_block_submit_full_fallback_stale_total[15m])
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Pool block submission required a non-stale full-block fallback
          description: A block candidate reached the daemon after its compact template ID was unknown or expired, and the fallback outcome was not an expected stale tip race.

      - alert: BlocknetPoolFullBlockFallbackFailed
        expr: increase(blocknet_pool_monitor_block_submit_full_fallback_errors_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Pool full-block submission fallback failed
          description: At least one retained full-block fallback encountered a transport error, unexpected daemon rejection, or negative success response in the last 15 minutes. Stale tip races are excluded.

      - alert: BlocknetPoolCandidatePipelineDropped
        expr: >-
          increase(blocknet_pool_monitor_candidate_permit_rejected_total[15m]) > 0
          or increase(blocknet_pool_monitor_candidate_enqueue_rejected_total[15m]) > 0
          or (
            increase(blocknet_pool_monitor_candidate_rejected_total[15m])
            > increase(blocknet_pool_monitor_candidate_stale_block_total[15m])
              + increase(blocknet_pool_monitor_candidate_disproven_claims_total[15m])
          )
          or increase(blocknet_pool_monitor_candidate_worker_failure_total[15m]) > 0
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Pool dropped a candidate before completing validation
          description: A network-target candidate was rejected by admission control, the queue, full validation/submission, or a submit-worker failure in the last 15 minutes. Expected stale tip races and cryptographically disproven candidate claims are excluded.

      - alert: BlocknetPoolCandidatePipelineDiverged
        expr: >-
          (
            blocknet_pool_monitor_candidate_classified_total
            != blocknet_pool_monitor_candidate_permit_acquired_total
              + blocknet_pool_monitor_candidate_permit_rejected_total
          )
          or
          (
            blocknet_pool_monitor_candidate_permit_acquired_total
            != blocknet_pool_monitor_candidate_enqueued_total
              + blocknet_pool_monitor_candidate_enqueue_rejected_total
          )
          or
          (
            blocknet_pool_monitor_candidate_enqueued_total
            != blocknet_pool_monitor_candidate_worker_started_total
              + blocknet_pool_monitor_candidate_submit_queue_depth
          )
          or
          (
            blocknet_pool_monitor_candidate_worker_started_total
            != blocknet_pool_monitor_candidate_persisted_total
              + blocknet_pool_monitor_candidate_rejected_total
              + blocknet_pool_monitor_candidate_worker_failure_total
          )
        for: 2m
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Pool candidate pipeline counters diverged
          description: A candidate has remained unaccounted for between classification, admission, queueing, worker execution, and persistence for more than two minutes.

      - alert: BlocknetPoolMinerBalanceProbeFailing
        # End-to-end probe of /api/miner/<addr>/balance including the
        # pending-estimate path; the metric is absent when the probe address
        # is unconfigured. A 2026-07-02 cache wedge took this endpoint down
        # for six hours while every other health check stayed green.
        expr: blocknet_pool_monitor_miner_balance_probe_up == 0
        for: 3m
        labels:
          severity: critical
          visibility: public
        annotations:
          summary: Miner balance API probe is failing
          description: The monitor cannot fetch a miner balance with pending estimate; miner-facing stats pages are likely broken or hanging.

      - alert: BlocknetPoolWalletUnavailable
        expr: blocknet_pool_monitor_wallet_up == 0
        for: 10m
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Pool wallet is unavailable
          description: The pool cannot read wallet balance state from the daemon.

      - alert: BlocknetPoolValidationBacklog
        expr: blocknet_pool_monitor_validation_candidate_queue_depth > 1536 or blocknet_pool_monitor_validation_regular_queue_depth > 1536
        for: 2m
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Validation backlog is growing
          description: One of the validation queues has exceeded 75% of the default capacity.

      - alert: BlocknetPoolValidationBacklogCritical
        expr: blocknet_pool_monitor_validation_candidate_queue_depth > 1843 or blocknet_pool_monitor_validation_regular_queue_depth > 1843
        for: 2m
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Validation backlog is critical
          description: One of the validation queues has exceeded 90% of the default capacity.

      - alert: BlocknetPoolShareIngressStalled
        expr: blocknet_pool_monitor_connected_miners > 0 and blocknet_pool_monitor_estimated_hashrate > 0 and blocknet_pool_monitor_last_accepted_share_age_seconds > 900
        for: 5m
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Accepted share progress has stalled
          description: Miners remain connected but the pool has not accepted a share for more than 15 minutes.

      - alert: BlocknetPoolShareIngressCriticallyStalled
        expr: blocknet_pool_monitor_connected_miners > 0 and blocknet_pool_monitor_estimated_hashrate > 0 and blocknet_pool_monitor_last_accepted_share_age_seconds > 1800
        for: 5m
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Accepted share progress is critically stalled
          description: Miners remain connected but the pool has not accepted a share for more than 30 minutes.

      - alert: BlocknetPoolPayoutQueueStalled
        # Mid-send age covers waiting for the payout tx's first confirmation.
        # The pool now finds well under 100% of network blocks, so 30-40 min
        # confirmation waits occur during normal luck streaks; only page past
        # an hour.
        expr: blocknet_pool_monitor_payout_pending_count > 0 and (blocknet_pool_monitor_oldest_pending_payout_age_seconds > 7200 or blocknet_pool_monitor_oldest_pending_send_age_seconds > 3600)
        for: 5m
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Payout queue is stalled
          description: Pending payouts have been queued or mid-send longer than the normal payout cadence.

      - alert: BlocknetPoolPayoutQueueCriticallyStalled
        expr: blocknet_pool_monitor_payout_pending_count > 0 and (blocknet_pool_monitor_oldest_pending_payout_age_seconds > 21600 or blocknet_pool_monitor_oldest_pending_send_age_seconds > 7200)
        for: 5m
        labels:
          severity: critical
          visibility: private
        annotations:
          summary: Payout queue is critically stalled
          description: Pending payouts have been queued or mid-send for several hours.

      - alert: BlocknetPoolRootDiskLow
        expr: 100 * node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} < 15
        for: 10m
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Root filesystem is low on space
          description: The root filesystem has less than 15% free space remaining.

      - alert: BlocknetPoolMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Host memory pressure is high
          description: Available system memory has been under 10% for at least 10 minutes.

      - alert: BlocknetPoolPublicProbeFailedFromHost
        expr: probe_success{job="blackbox_http_public"} == 0
        for: 5m
        labels:
          severity: warning
          visibility: private
        annotations:
          summary: Public monitor endpoint failed from the host
          description: The host-local blackbox probe could not fetch the public monitor endpoint.
