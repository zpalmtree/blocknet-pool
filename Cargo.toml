[workspace]
resolver = "2"
members = [
    "crates/pool-common",
    "crates/pool-runtime",
    "crates/pool-recovery",
    "crates/pool-gateway",
    "apps/blocknet-pool-api",
    "apps/blocknet-pool-stratum",
    "apps/blocknet-pool-gateway",
    "apps/blocknet-pool-monitor",
    "apps/blocknet-pool-recoveryd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
blocknet-pow-kernel = { git = "https://github.com/zpalmtree/seine.git", rev = "752f6679d0656eb45404bf867a72a3c475c59cdf" }
curve25519-dalek = "4.1"
argon2 = "0.5"
blake2 = "0.10"
axum = "0.7"
base64 = "0.22"
bs58 = "0.5"
chrono = "0.4"
dotenvy = "0.15"
flume = "0.11"
hex = "0.4"
humantime = "2.1"
libc = "0.2"
parking_lot = "0.12"
postgres = "0.19"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
sha3 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3.10"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2.1"
